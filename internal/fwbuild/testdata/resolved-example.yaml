substitutions:
  sil_name: e2e-lint
  sil_mac: 02:aa:bb:cc:dd:01
  sil_port: '6054'
esphome:
  name: sil-e2e-lint
  friendly_name: SiL e2e-lint
  build_flags:
    - -static
  min_version: 2026.10.1
  build_path: /build/sil-e2e-lint
  platformio_options: {}
  environment_variables: {}
  includes: []
  includes_c: []
  libraries: []
  name_add_mac_suffix: false
  merge_warnings: true
  debug_scheduler: false
  suspend_loop: false
  areas: []
  devices: []
host:
  mac_address: 02:AA:BB:CC:DD:01
logger:
  level: INFO
  baud_rate: 115200
  tx_buffer_size: 512
  deassert_rts_dtr: false
  logs: {}
  runtime_tag_levels: false
api:
  port: 6054
  reboot_timeout: 0s
  encryption:
    key: \033[8mDUMMYKEY\033[28m
  batch_delay: 100ms
  custom_services: false
  homeassistant_services: false
  homeassistant_states: false
  listen_backlog: 4
  max_connections: 8
  max_send_queue: 16
external_components:
  - source:
      path: /repo/examples/../components
      type: local
    components:
      - sim_bus
    refresh: 1d
sim_bus:
  id: bus
  path: /tmp/sil.sock
output:
  - platform: sim_bus
    id: pwm_fan1
    channel: port1.duty
    zero_means_zero: false
  - platform: sim_bus
    id: pwm_fan2
    channel: port2.duty
    zero_means_zero: false
  - platform: sim_bus
    id: pwm_fan3
    channel: port3.duty
    zero_means_zero: false
  - platform: sim_bus
    id: pwm_fan4
    channel: port4.duty
    zero_means_zero: false
fan:
  - platform: speed
    output: pwm_fan1
    name: Fan 1
    id: fan1
    speed_count: 100
    restore_mode: ALWAYS_OFF
    disabled_by_default: false
  - platform: speed
    output: pwm_fan2
    name: Fan 2
    id: fan2
    speed_count: 100
    restore_mode: ALWAYS_OFF
    disabled_by_default: false
  - platform: speed
    output: pwm_fan3
    name: Fan 3
    id: fan3
    speed_count: 100
    restore_mode: ALWAYS_OFF
    disabled_by_default: false
  - platform: speed
    output: pwm_fan4
    name: Fan 4
    id: fan4
    speed_count: 100
    restore_mode: ALWAYS_OFF
    disabled_by_default: false
sensor:
  - platform: sim_bus
    channel: port1.rpm
    name: Fan 1 Speed
    id: fan1_speed
    unit_of_measurement: RPM
    accuracy_decimals: 0
    disabled_by_default: false
    force_update: false
    update_interval: 1s
  - platform: sim_bus
    channel: port2.rpm
    name: Fan 2 Speed
    id: fan2_speed
    unit_of_measurement: RPM
    accuracy_decimals: 0
    disabled_by_default: false
    force_update: false
    update_interval: 1s
  - platform: sim_bus
    channel: port3.rpm
    name: Fan 3 Speed
    id: fan3_speed
    unit_of_measurement: RPM
    accuracy_decimals: 0
    disabled_by_default: false
    force_update: false
    update_interval: 1s
  - platform: sim_bus
    channel: port4.rpm
    name: Fan 4 Speed
    id: fan4_speed
    unit_of_measurement: RPM
    accuracy_decimals: 0
    disabled_by_default: false
    force_update: false
    update_interval: 1s

