<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>sil</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/vendor/uPlot.min.css">
<link rel="stylesheet" href="/app.css">
<script src="/vendor/uPlot.iife.min.js"></script>
<script type="module" src="/js/app.js"></script>
</head>
<body>
<header id="header">
  <div class="cell cell-instance"><span class="value strong" data-src="instance" data-fmt="text">--</span></div>
  <div class="cell cell-time"><span class="label">SIM TIME</span><span class="value big" data-src="sim.time_s" data-fmt="simtime">--</span></div>
  <div class="cell cell-factor"><span class="label">TIME FACTOR</span><span class="value" data-src="sim.time_factor" data-fmt="factor">--</span></div>
  <div class="cell cell-firmware"><span class="label">FIRMWARE</span><span class="value" data-src="firmware.bus_connected" data-fmt="firmware">--</span></div>
  <div class="cell cell-realtime"><span class="label">REAL TIME</span><span class="value" data-src="sim.behind_real_time" data-fmt="realtime">--</span></div>
  <div id="message" role="status" aria-live="polite" data-ui-only></div>
  <div class="cell cell-link"><span class="label">LINK</span><span class="value" id="link" data-ui-only>CONNECTING</span></div>
</header>
<main id="ports"></main>
<footer id="strip">
  <section class="group" id="leds-group">
    <span class="label">LEDS</span>
    <div id="leds"></div>
  </section>
  <section class="group" id="usr-group">
    <span class="label">BUTTONS</span>
    <div class="caps">
      <button class="usr" type="button" data-id="usr1" data-src="buttons.usr1" data-fmt="pressed" aria-label="Hold USR1" disabled>USR1</button>
      <button class="usr" type="button" data-id="usr2" data-src="buttons.usr2" data-fmt="pressed" aria-label="Hold USR2" disabled>USR2</button>
      <button class="usr" type="button" data-id="usr3" data-src="buttons.usr3" data-fmt="pressed" aria-label="Hold USR3" disabled>USR3</button>
    </div>
  </section>
  <section class="group" id="env-group">
    <span class="label">ENVIRONMENT</span>
    <div class="fields">
      <div class="field">
        <span class="label">TEMPERATURE</span>
        <span class="control"><input id="temperature" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="--" data-src="env.temperature" data-fmt="num" aria-label="Temperature in degrees Celsius" disabled><span class="unit">&deg;C</span></span>
      </div>
      <div class="field">
        <span class="label">HUMIDITY</span>
        <span class="control"><input id="humidity" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="--" data-src="env.humidity" data-fmt="num" aria-label="Relative humidity in percent" disabled><span class="unit">%RH</span></span>
      </div>
      <button id="apply" type="button" disabled>APPLY VALUES</button>
    </div>
  </section>
</footer>
<template id="port-panel">
  <section class="port">
    <div class="row">
      <span class="chip" data-src="ports.{i}.port" data-fmt="chip">--</span>
      <select class="fan" data-src="ports.{i}.fan" data-fmt="select" disabled><option value="--">--</option></select>
      <span class="readout"><span class="value rpm" data-src="ports.{i}.rpm" data-fmt="rpm">--</span><span class="unit">RPM</span></span>
      <span class="readout"><span class="value duty" data-src="ports.{i}.duty" data-fmt="pct">--</span><span class="unit">% DUTY</span></span>
    </div>
    <div class="scope">
      <div class="plot"></div>
      <div class="legend" data-ui-only>
        <span class="key"><svg class="swatch" width="24" height="8" viewBox="0 0 24 8" aria-hidden="true"><line x1="0" y1="4" x2="24" y2="4" stroke="currentColor" stroke-width="2"/></svg>RPM</span>
        <span class="key"><svg class="swatch" width="24" height="8" viewBox="0 0 24 8" aria-hidden="true"><line x1="0" y1="4" x2="24" y2="4" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/></svg>DUTY</span>
      </div>
      <span class="timebase" data-ui-only>6 s/div</span>
      <div class="empty" data-ui-only>
        <span class="empty-head" data-ui-only>WAITING FOR FIRST SAMPLE</span>
        <span class="empty-body" data-ui-only></span>
      </div>
    </div>
  </section>
</template>
<template id="led">
  <div class="led">
    <span class="lens" role="img"></span>
    <span class="led-caption"></span>
    <span class="led-hex" data-src="leds.strip.{i}" data-fmt="hex">--</span>
  </div>
</template>
</body>
</html>
