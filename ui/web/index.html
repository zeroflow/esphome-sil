<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>sil</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/js/app.js"></script>
</head>
<body>
<header id="header">
  <div class="cell cell-instance"><span class="value strong" data-src="instance" data-fmt="text">--</span></div>
  <div class="cell cell-time"><span class="label">SIM TIME</span><span class="value big" data-src="sim.time_s" data-fmt="simtime">--</span></div>
  <div class="cell cell-factor"><span class="label">TIME FACTOR</span><span class="value" data-src="sim.time_factor" data-fmt="factor">--</span></div>
  <div class="cell cell-firmware"><span class="label">FIRMWARE</span><span class="value" data-src="firmware.bus_connected" data-fmt="firmware">--</span></div>
  <div id="message" role="status" aria-live="polite" data-ui-only></div>
  <div class="cell cell-link"><span class="label">LINK</span><span class="value" id="link" data-ui-only>CONNECTING</span></div>
</header>
<main id="ports"></main>
<footer id="strip">
  <section class="group" id="leds-group">
    <span class="label">LEDS</span>
    <div id="leds"></div>
  </section>
  <section class="group" id="env-group">
    <span class="label">ENVIRONMENT</span>
    <div class="fields">
      <div class="field">
        <span class="label">TEMPERATURE</span>
        <span class="control"><input id="temperature" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="--" data-src="env.temperature" data-fmt="num" aria-label="Temperature in degrees Celsius" disabled><span class="unit">&deg;C</span></span>
      </div>
      <div class="field">
        <span class="label">HUMIDITY</span>
        <span class="control"><input id="humidity" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="--" data-src="env.humidity" data-fmt="num" aria-label="Relative humidity in percent" disabled><span class="unit">%RH</span></span>
      </div>
      <button id="apply" type="button" disabled>APPLY VALUES</button>
    </div>
  </section>
</footer>
<template id="port-panel">
  <section class="port">
    <div class="row">
      <span class="chip" data-src="ports.{i}.port" data-fmt="chip">--</span>
      <select class="fan" data-src="ports.{i}.fan" data-fmt="select" disabled><option value="--">--</option></select>
      <span class="readout"><span class="value rpm" data-src="ports.{i}.rpm" data-fmt="rpm">--</span><span class="unit">RPM</span></span>
      <span class="readout"><span class="value duty" data-src="ports.{i}.duty" data-fmt="pct">--</span><span class="unit">% DUTY</span></span>
    </div>
    <div class="scope"></div>
  </section>
</template>
<template id="led">
  <div class="led">
    <span class="lens" role="img"></span>
    <span class="led-caption"></span>
    <span class="led-hex" data-src="leds.strip.{i}" data-fmt="hex">--</span>
  </div>
</template>
</body>
</html>
