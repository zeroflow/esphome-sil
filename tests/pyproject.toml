[project]
name = "sil-contract"
version = "0.1.0"
description = "Contract and smoke tests for the esphome-sil bench (drive sil through its CLI, talk to the firmware with aioesphomeapi)"
requires-python = ">=3.12"
dependencies = [
    "aioesphomeapi==46.12.0",
    "pytest==9.2.0",
    "pytest-timeout==2.4.0",
]

[tool.uv]
package = false
# Same lock scope as the product HIL harness: Linux only.
environments = ["sys_platform == 'linux'"]
# Transitive versions are pinned to the product's reviewed HIL lock (../wifi-fancontroller/hil/uv.lock).
# Generated from that lock's package names and versions (every package except its own project row);
# `make lock-check` proves the resulting tests/uv.lock has the same versions and sha256 sets.
# Constraints for packages this project does not use are inert.
constraint-dependencies = [
    "aioesphomeapi==46.12.0",
    "aiohappyeyeballs==2.7.1",
    "async-interrupt==1.2.2",
    "backports-zstd==1.8.0",
    "bitstring==5.0.0",
    "cffi==2.1.1",
    "chacha20poly1305-reuseable==0.13.2",
    "click==8.5.0",
    "cryptography==50.0.2",
    "esp-pylib==1.2.0",
    "esphome==2026.10.1",
    "esptool==5.4.0",
    "ifaddr==0.2.0",
    "iniconfig==2.3.1",
    "intelhex==2.3.0",
    "markdown-it-py==4.2.0",
    "mdurl==0.1.2",
    "noiseprotocol==0.3.1",
    "packaging==26.3",
    "pluggy==1.7.0",
    "protobuf==7.36.2",
    "pycparser==3.12",
    "pygments==2.21.0",
    "pyserial==3.5",
    "pytest==9.2.0",
    "pytest-timeout==2.4.0",
    "pyyaml==6.0.3",
    "reedsolo==1.7.0",
    "rich==15.0.0",
    "rich-click==1.9.9",
    "tibs==2.0.2",
    "tzdata==2026.6",
    "tzlocal==5.4.5",
    "websockets==17.4",
    "zeroconf==0.151.5",
]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
# -rs: every skip and its reason appear in the run output (the tests themselves never skip).
addopts = "-p no:cacheprovider -rs"
# Per-test ceiling; signal mode raises inside the test so fixture finalizers (sil down) still run.
timeout = 120
timeout_method = "signal"
