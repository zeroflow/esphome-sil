# Noctua NF-A12x25 PWM, 120 mm case fan (second shipped fan: a fan that never stops, MODEL-03, D-10).
#
# Schema 2 (Phase 4). Every number carries a provenance entry in [provenance] that says where it comes
# from. Values are ASSUMED unless their provenance says otherwise; this fan stays assumed until v0.3.
# The v0.1.0 flat file lives on, byte for byte, as testdata/fans-v0.1.0/noctua-nf-a12x25-pwm.toml.
schema = 2
name = "Noctua NF-A12x25 PWM"

[sources]
# An official vendor datasheet PDF counts as `datasheet` wherever it is hosted (D-04 amendment, case b).
noctua_datasheet = "https://123-3D.nl/pdf/DMO00072_info.pdf (official Noctua datasheet PDF, NOCTUA NF-A12x25 PWM Datasheet EN, retailer-hosted copy)"
noctua_page = "https://noctua.at/en/nf-a12x25-pwm/specification (not fetched: HTTP 429; reference only)"

[stop]
duty = 0.0             # never stops (D-10): the floor rpm is the first curve point at duty 0

[start]
duty = 0.20            # assumed
delay_s = 0.0          # assumed: a never-stops fan runs from power-up, so neither start value takes effect

[dynamics]
tau_up_s = 1.0         # assumed
tau_down_s = 2.5       # assumed
coast_tau_s = 6.0      # assumed

# The 450 rpm floor is from a search summary, not from the datasheet PDF, so it stays assumed; the 2000 rpm
# maximum is on the datasheet. The interior points are assumed.
[curve.up]
duty = [0.0, 0.20, 0.40, 0.60, 0.80, 1.00]
rpm = [450, 450, 860, 1260, 1640, 2000]

[curve.down]
duty = [0.0, 0.20, 0.40, 0.60, 0.80, 1.00]
rpm = [450, 450, 820, 1220, 1600, 2000]

[tach]
ppr = 2                # assumed
# The standard deviation of the noise in a 1 s reading: two thirds of the 30 rpm step, so the
# firmware-visible trace jitters (D-03 amendment).
noise_rpm = 20.0       # assumed

[datasheet]
airflow_m3h = 102.1
power_w = 1.68         # the datasheet's maximum input power, at ref_rpm
ref_rpm = 2000

[provenance]
"stop.duty" = "assumed"
"start.duty" = "assumed"
"start.delay_s" = "assumed"
"dynamics.tau_up_s" = "assumed"
"dynamics.tau_down_s" = "assumed"
"dynamics.coast_tau_s" = "assumed"
"curve.up" = "assumed:noctua_datasheet"
"curve.down" = "assumed"
"tach.ppr" = "assumed"
"tach.noise_rpm" = "assumed"
"datasheet.airflow_m3h" = "datasheet:noctua_datasheet"
"datasheet.power_w" = "datasheet:noctua_datasheet"
"datasheet.ref_rpm" = "datasheet:noctua_datasheet"
